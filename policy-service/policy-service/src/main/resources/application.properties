spring.application.name=POLICY-SERVICE
server.port=8082

spring.datasource.url=jdbc:mysql://mysql:3306/microservices_db
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

feign.circuitbreaker.enabled=true

resilience4j.circuitbreaker.instances.userService.register-health-indicator=true
resilience4j.circuitbreaker.instances.userService.sliding-window-size=5
resilience4j.circuitbreaker.instances.userService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.userService.wait-duration-in-open-state=10s

# This is what was missing \u2014 explicitly tell Resilience4j to catch Feign errors
resilience4j.circuitbreaker.instances.userService.record-exception-predicate=feign.FeignException
resilience4j.circuitbreaker.instances.userService.record-exceptions[0]=feign.FeignException
resilience4j.circuitbreaker.instances.userService.record-exceptions[1]=java.lang.Exception

eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=10