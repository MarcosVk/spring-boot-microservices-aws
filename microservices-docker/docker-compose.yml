services:

  mysql:
    image: mysql:8
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: microservices_db
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  eureka-server:
    build: ../eureka-server/eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  user-service:
    build: ../user-service/user-service
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  policy-service:
    build: ../policy-service/policy-service
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  api-gateway:
    build: ../api-gateway-application/api-gateway-application
    ports:
      - "8080:8080"
    depends_on:
      eureka-server:
        condition: service_healthy

  auth-service:
    build: ../auth-service/auth-service
    ports:
      - "8083:8083"
    depends_on:
      eureka-server:
        condition: service_healthy
      mysql:
        condition: service_healthy